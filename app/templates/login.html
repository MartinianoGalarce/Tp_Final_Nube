{% extends 'base.html' %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="card shadow">
            <div class="card-header">
                <i class="bi bi-shield-lock login-icon"></i>
                <h4>Iniciar Sesión</h4>
                <small>Sistema de Gestión de Stock — IFTS 18</small>
            </div>

            <div class="card-body">
                <form method="POST" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label" for="username">
                            <i class="bi bi-person me-1"></i>Usuario
                        </label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="usuario de dominio"
                            required
                            autofocus
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="password">
                            <i class="bi bi-lock me-1"></i>Contraseña
                        </label>
                        <div class="input-group">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="••••••••"
                                required
                            >
                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                id="togglePassword"
                                tabindex="-1"
                                title="Mostrar / ocultar contraseña"
                                style="border:1.5px solid #d1d5db; border-left:none;"
                            >
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
                    </button>
                </form>
            </div>

            <div class="card-footer">
                <small class="text-muted">
                    <i class="bi bi-clock me-1"></i>
                    Acceso permitido de <strong>8:00</strong> a <strong>18:00 hs</strong>
                    &nbsp;·&nbsp;
                    <i class="bi bi-shield-check me-1"></i>Autenticación Active Directory
                </small>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById('togglePassword').addEventListener('click', function () {
    var input = document.getElementById('password');
    var icon  = document.getElementById('toggleIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
});
</script>
{% endblock %}
