{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-header bg-dark text-white text-center">
                <h4><i class="bi bi-shield-lock"></i> Iniciar Sesión</h4>
                <small>Autenticación Active Directory</small>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" placeholder="usuario AD" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Ingresar
                    </button>
                </form>
            </div>
            <div class="card-footer text-center text-muted">
                <small><i class="bi bi-clock"></i> Acceso permitido de 8:00 a 18:00 hs</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
