{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card">
            <div class="card-header">
                <h5>
                    <i class="bi bi-arrow-left-right me-2"></i>
                    Registrar movimiento
                </h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label" for="producto_id">
                            <i class="bi bi-box me-1"></i>Producto
                        </label>
                        <select name="producto_id" id="producto_id" class="form-select" required>
                            <option value="">— Seleccioná un producto —</option>
                            {% for p in productos %}
                            <option value="{{ p.id }}">
                                {{ p.nombre }}
                                {% if p.stock <= 5 %} ⚠ Stock crítico: {{ p.stock }}
                                {% elif p.stock <= 20 %} · Stock bajo: {{ p.stock }}
                                {% else %} · Stock: {{ p.stock }}{% endif %}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="tipo">
                            <i class="bi bi-arrow-left-right me-1"></i>Tipo de movimiento
                        </label>
                        <select name="tipo" id="tipo" class="form-select" required>
                            <option value="entrada">Entrada — ingreso de stock</option>
                            <option value="salida">Salida — egreso de stock</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="cantidad">
                            <i class="bi bi-123 me-1"></i>Cantidad
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-hash"></i></span>
                            <input
                                type="number"
                                id="cantidad"
                                name="cantidad"
                                class="form-control"
                                min="1"
                                placeholder="1"
                                required
                            >
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="observacion">
                            <i class="bi bi-chat-left-text me-1"></i>Observación
                            <span class="text-muted fw-normal">(opcional)</span>
                        </label>
                        <input
                            type="text"
                            id="observacion"
                            name="observacion"
                            class="form-control"
                            placeholder="Motivo, proveedor, destino…"
                        >
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('movimientos.listar') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Volver
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle me-1"></i> Registrar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
