{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h5>{{ 'Editar' if producto else 'Nuevo' }} Producto</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control"
                               value="{{ producto.nombre if producto else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <input type="text" name="descripcion" class="form-control"
                               value="{{ producto.descripcion if producto else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Stock inicial</label>
                        <input type="number" name="stock" class="form-control" min="0"
                               value="{{ producto.stock if producto else 0 }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Precio</label>
                        <input type="number" name="precio" class="form-control" min="0" step="0.01"
                               value="{{ producto.precio if producto else 0 }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Categoría</label>
                        <input type="text" name="categoria" class="form-control"
                               value="{{ producto.categoria if producto else '' }}">
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('stock.listar') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Volver
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
