{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card">
            <div class="card-header">
                <h5>
                    <i class="bi bi-{{ 'pencil-square' if producto else 'plus-circle' }} me-2"></i>
                    {{ 'Editar producto' if producto else 'Nuevo producto' }}
                </h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            class="form-control"
                            placeholder="Ej: Teclado mecánico"
                            value="{{ producto.nombre if producto else '' }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="descripcion">Descripción</label>
                        <input
                            type="text"
                            id="descripcion"
                            name="descripcion"
                            class="form-control"
                            placeholder="Descripción breve del producto (opcional)"
                            value="{{ producto.descripcion if producto else '' }}"
                        >
                    </div>

                    <div class="row">
                        <div class="col-sm-6 mb-3">
                            <label class="form-label" for="stock">Stock</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-boxes"></i></span>
                                <input
                                    type="number"
                                    id="stock"
                                    name="stock"
                                    class="form-control"
                                    min="0"
                                    placeholder="0"
                                    value="{{ producto.stock if producto else 0 }}"
                                    required
                                >
                            </div>
                        </div>
                        <div class="col-sm-6 mb-3">
                            <label class="form-label" for="precio">Precio</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input
                                    type="number"
                                    id="precio"
                                    name="precio"
                                    class="form-control"
                                    min="0"
                                    step="0.01"
                                    placeholder="0.00"
                                    value="{{ producto.precio if producto else 0 }}"
                                    required
                                >
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="categoria">Categoría</label>
                        <input
                            type="text"
                            id="categoria"
                            name="categoria"
                            class="form-control"
                            placeholder="Ej: Periféricos, Mobiliario…"
                            value="{{ producto.categoria if producto else '' }}"
                        >
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('stock.listar') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Volver
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle me-1"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
